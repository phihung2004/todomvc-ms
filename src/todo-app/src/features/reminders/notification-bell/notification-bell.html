<div class="bell-wrapper">
  <!-- Nút Chuông giữ nguyên -->
  <button class="bell-button" (click)="togglePanel()">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.75"
      stroke="currentColor"
      class="bell-icon"
      style="width: 24px; height: 24px"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"
      />
    </svg>
    @if ((store.pendingCount$ | async)! > 0) {
      <span class="badge">{{ store.pendingCount$ | async }}</span>
    }
  </button>

  <!-- Khung Dropdown Danh sách trễ hạn -->
  @if (isPanelOpen) {
    <div class="panel-dropdown">
      <div class="panel-header">
        <h3>Task overdue!</h3>
      </div>

      <ul class="reminder-list">
        <!-- Vòng lặp đẻ ra các Dumb Component -->
        @for (item of remindersWithTitle$ | async; track item.id) {
          <app-bell-item
            [item]="item"
            [title]="item.title"
            (snooze)="snooze($event)"
            (dismiss)="dismiss($event)"
          ></app-bell-item>
        } @empty {
          <li class="empty-msg">No overdue tasks!</li>
        }
      </ul>
    </div>
  }
</div>
