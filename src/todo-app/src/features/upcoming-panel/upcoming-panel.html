<div class="upcoming-wrapper">
  <!-- Nút Lịch -->
  <button class="calendar-button" (click)="togglePanel()">
    <!-- Icon Lịch siêu mượt -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="calendar-icon"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"
      />
    </svg>

    <!-- Dấu chấm đỏ báo số lượng -->
    @if ((store.upcomingCount$ | async)! > 0) {
      <span class="badge">
        {{ store.upcomingCount$ | async }}
      </span>
    }
  </button>

  <!-- Bảng xổ xuống -->
  @if (isPanelOpen) {
    <div class="panel-dropdown">
      <div class="panel-header">Upcoming in 24h</div>

      <ul class="upcoming-list">
        @for (item of store.upcoming$ | async; track item.id) {
          <li class="upcoming-item">
            <span class="upcoming-title">{{ item.title }}</span>
            <span class="upcoming-date">{{ item.dueAt | date: 'medium' }}</span>
          </li>
        } @empty {
          <li class="empty-msg">No upcoming task</li>
        }
      </ul>
    </div>
  }
</div>
